<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 30 420 370" width="100%" height="100%">
  <!-- Dedicated App Icon Mark: Tri-color Speedometer Gauge + Leaf Clock Checkmark -->
  <g transform="translate(250, 230)">
    <!-- 8 Segmented Arcs (from bottom-left dark green around to red) -->
    <!-- Seg 1: Deep Green with Arrow -->
    <path d="M -160 80 A 180 180 0 0 1 -175 -40" stroke="#0D7A57" stroke-width="34" stroke-linecap="butt" fill="none" />
    <polygon points="-168,95 -185,60 -150,75" fill="#0D7A57" />

    <!-- Seg 2: Rich Green -->
    <path d="M -165 -60 A 180 180 0 0 1 -125 -130" stroke="#10B981" stroke-width="34" stroke-linecap="butt" fill="none" />

    <!-- Seg 3: Vibrant Green -->
    <path d="M -110 -145 A 180 180 0 0 1 -35 -177" stroke="#22C55E" stroke-width="34" stroke-linecap="butt" fill="none" />

    <!-- Seg 4: Chartreuse / Lime Green -->
    <path d="M -15 -180 A 180 180 0 0 1 65 -168" stroke="#84CC16" stroke-width="34" stroke-linecap="butt" fill="none" />

    <!-- Seg 5: Warm Yellow -->
    <path d="M 85 -160 A 180 180 0 0 1 140 -115" stroke="#EAB308" stroke-width="34" stroke-linecap="butt" fill="none" />

    <!-- Seg 6: Amber Orange -->
    <path d="M 155 -95 A 180 180 0 0 1 180 -30" stroke="#F97316" stroke-width="34" stroke-linecap="butt" fill="none" />

    <!-- Seg 7: Orange Red -->
    <path d="M 180 -10 A 180 180 0 0 1 170 55" stroke="#EF4444" stroke-width="34" stroke-linecap="butt" fill="none" />

    <!-- Seg 8: Urgent Red -->
    <path d="M 160 70 A 180 180 0 0 1 135 125" stroke="#DC2626" stroke-width="34" stroke-linecap="butt" fill="none" />

    <!-- Central Leaf Shape -->
    <g transform="translate(-10, -20) rotate(-10)">
      <!-- Leaf Body -->
      <path d="M 0 -85 C 65 -85, 95 -10, 85 45 C 75 95, 20 100, -35 85 C -85 70, -95 10, -85 -45 C -75 -75, -40 -85, 0 -85 Z"
            fill="#86EFAC" stroke="#15803D" stroke-width="12" stroke-linejoin="round" />

      <!-- Internal Clock Hand / Checkmark -->
      <path d="M -10 -40 L -10 15 L 45 -25"
            stroke="#15803D" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Acronym: UIF -->
    <text x="-5" y="130" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="40" font-weight="900" fill="#15803D" letter-spacing="3">UIF</text>
  </g>
</svg>
